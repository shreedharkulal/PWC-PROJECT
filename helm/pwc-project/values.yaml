frontend:
  replicaCount: 1
  image:
    repository: myregistry.azurecr.io/pwc-project-frontend
    tag: initial
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

backend:
  replicaCount: 1
  image:
    repository: myregistry.azurecr.io/pwc-project-backend
    tag: initial
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
