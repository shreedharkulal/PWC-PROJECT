frontend:
  replicaCount: 2
  image:
    repository: fronted.azurecr.io/pwc-project-frontend
    tag: "cb581deee705e2b1cdfce9526d589c7e7b933d25"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

backend:
  replicaCount: 2
  image:
    repository: backends.azurecr.io/backends
    tag: "cb581deee705e2b1cdfce9526d589c7e7b933d25"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

keyVault:
  enabled: true
  secretProviderClass: pwc-demo-keyvault
  mountPath: /mnt/secrets-store

database:
  enabled: true
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  database: pwcprod
  username: pwcprod
  service:
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
