frontend:
  replicaCount: 1
  image:
    repository: fronted.azurecr.io/pwc-project-frontend
    tag: "cb581deee705e2b1cdfce9526d589c7e7b933d25"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
backend:
  replicaCount: 1
  image:
    repository: backends.azurecr.io/backends
    tag: "cb581deee705e2b1cdfce9526d589c7e7b933d25"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
keyVault:
  enabled: true
  secretProviderClass: pwc-demo-keyvault
  mountPath: /mnt/secrets-store
database:
  enabled: true
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  username: pwcdev
  # Do not store the actual database password in Git.
  # Configure the database chart to retrieve it securely.
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
