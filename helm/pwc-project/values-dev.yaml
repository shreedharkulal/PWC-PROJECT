frontend:
  replicaCount: 1
  image:
    repository: myregistry.azurecr.io/pwc-project-frontend
    tag: "initial"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

backend:
  replicaCount: 1
  image:
    repository: myregistry.azurecr.io/pwc-project-backend
    tag: "initial"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi


