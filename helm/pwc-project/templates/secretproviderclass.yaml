apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pwc-demo-keyvault
  namespace: dev
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "79f091fe-2bdd-4f20-afed-5ea91139dee6"
    keyvaultName: "pwc-demo-kv"
    tenantId: "e74a8c2c-7fa2-470e-93e0-1914985714b2"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""
