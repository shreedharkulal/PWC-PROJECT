apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  namespace: dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flyway
          image: flyway/flyway:11
          args:
            - migrate
          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://pwc-project-dev-db:5432/pwcdev"
            - name: FLYWAY_USER
              value: "pwcdev"
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pwc-db-keyvault-secret
                  key: POSTGRES_PASSWORD
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
          volumeMounts:
            - name: migrations
              mountPath: /flyway/sql
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: database-migrations
