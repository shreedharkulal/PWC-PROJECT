apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pwc-project-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/shreedharkulal/PWC-PROJECT.git
    targetRevision: main
    path: helm/pwc-project
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
