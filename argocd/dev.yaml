apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pwc-project-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/PWC-PROJECT.git
    targetRevision: main
    path: helm/pwc-project
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pwc-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
