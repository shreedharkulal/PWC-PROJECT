name: Database Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: database-deploy-dev
  cancel-in-progress: false

jobs:
  migrate-dev:
    name: Backup, Migrate and Validate Dev PostgreSQL
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Migration Files
        shell: bash
        run: |
          set -euo pipefail

          test -d database/migrations

          if ! compgen -G "database/migrations/V*__*.sql" > /dev/null; then
            echo "No Flyway migration files found."
            exit 1
          fi

          echo "Migration files:"
          ls -1 database/migrations/V*__*.sql

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail

          test -n "$RESOURCE_GROUP"
          test -n "$CLUSTER_NAME"

          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing

      - name: Verify Kubernetes Access
        shell: bash
        run: |
          set -euo pipefail

          kubectl get namespace dev
          kubectl get service pwc-project-dev-db -n dev

          kubectl rollout status \
            deployment/pwc-project-dev-db \
            -n dev \
            --timeout=120s

      - name: Create and Upload PostgreSQL Backup
        shell: bash
        env:
          STORAGE_ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail

          test -n "$STORAGE_ACCOUNT"

          BACKUP_FILE="$RUNNER_TEMP/pwcdev-$(date -u +%Y%m%d-%H%M%S).dump"

          # Export a custom-format PostgreSQL backup.
          # Requires POSTGRES_PASSWORD in the database container.
          kubectl exec deployment/pwc-project-dev-db -n dev -- \
            sh -c '
              set -eu
              test -n "${POSTGRES_PASSWORD:-}"
              export PGPASSWORD="$POSTGRES_PASSWORD"
              pg_dump -U pwcdev -d pwcdev -Fc
            ' > "$BACKUP_FILE"

          test -s "$BACKUP_FILE"

          # Verify the backup archive before uploading.
          pg_restore --list "$BACKUP_FILE" > /dev/null

          echo "Backup archive verified."

          az storage blob upload \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name db-backups \
            --name "$(basename "$BACKUP_FILE")" \
            --file "$BACKUP_FILE" \
            --overwrite false

          echo "Backup uploaded successfully."

      - name: Upload Migration Files
        shell: bash
        run: |
          set -euo pipefail

          kubectl create configmap database-migrations \
            --namespace dev \
            --from-file=database/migrations/ \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Start Flyway Migration Job
        shell: bash
        run: |
          set -euo pipefail

          kubectl delete job database-migration \
            -n dev --ignore-not-found --wait=true

          kubectl apply -f k8s/database-migration-job.yaml

      - name: Wait for Migration Result
        shell: bash
        run: |
          set -euo pipefail

          if kubectl wait \
            --for=condition=complete \
            job/database-migration \
            -n dev \
            --timeout=300s; then
            echo "Database migrations completed successfully."
          else
            echo "Database migration failed or timed out."

            kubectl describe job database-migration \
              -n dev || true

            kubectl logs job/database-migration \
              -n dev || true

            echo "Pipeline stopped. Pre-migration backup is retained."
            echo "Investigate the failure before attempting recovery."
            exit 1
          fi

      - name: Validate Database Schema Dynamically
        shell: bash
        run: |
          set -euo pipefail

          kubectl exec deployment/pwc-project-dev-db -n dev -- \
            psql -v ON_ERROR_STOP=1 -U pwcdev -d pwcdev -c "
              DO \$\$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1
                  FROM information_schema.schemata
                  WHERE schema_name = 'public'
                ) THEN
                  RAISE EXCEPTION 'Public schema is missing';
                END IF;

                IF NOT EXISTS (
                  SELECT 1
                  FROM information_schema.tables
                  WHERE table_schema = 'public'
                    AND table_type = 'BASE TABLE'
                ) THEN
                  RAISE EXCEPTION 'No tables found in public schema';
                END IF;
              END
              \$\$;
            "

          echo "Dynamic schema validation passed."

      - name: Verify Flyway Migration History
        shell: bash
        run: |
          set -euo pipefail

          kubectl exec deployment/pwc-project-dev-db -n dev -- \
            psql -v ON_ERROR_STOP=1 -U pwcdev -d pwcdev -c "
              SELECT installed_rank,
                     version,
                     description,
                     success
              FROM public.flyway_schema_history
              ORDER BY installed_rank;
            "

          echo "Flyway migration history verified."

      - name: Show Migration Logs
        if: always()
        shell: bash
        run: |
          kubectl logs job/database-migration -n dev || true
