name: PWC Project CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  code-quality:
    name: Code Quality and Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm install

      - name: Run backend lint
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm run lint --if-present

      - name: Run backend unit tests
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm test --if-present

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: code-quality
    if: >
      secrets.SONAR_TOKEN != '' &&
      vars.SONAR_HOST_URL != '' &&
      vars.SONAR_PROJECT_KEY != ''
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,frontend
            -Dsonar.qualitygate.wait=true
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

  trivy-fs:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    needs: code-quality
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  helm-lint:
    name: Helm Lint and Template Validation
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint ./helm/pwc-project --values ./helm/pwc-project/values.yaml
          helm lint ./helm/pwc-project --values ./helm/pwc-project/values-dev.yaml
          helm lint ./helm/pwc-project --values ./helm/pwc-project/values-prod.yaml

      - name: Render Helm templates
        run: |
          helm template pwc-project ./helm/pwc-project --values ./helm/pwc-project/values.yaml > /tmp/pwc-render.yaml
          helm template pwc-project ./helm/pwc-project --values ./helm/pwc-project/values-dev.yaml > /tmp/pwc-render-dev.yaml
          helm template pwc-project ./helm/pwc-project --values ./helm/pwc-project/values-prod.yaml > /tmp/pwc-render-prod.yaml

  build-and-scan-images:
    name: Build and Scan Docker Images
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pwc-project-backend:${{ env.IMAGE_TAG }} ./backend

      - name: Build frontend image
        run: docker build -t pwc-project-frontend:${{ env.IMAGE_TAG }} ./frontend

      - name: Trivy backend image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pwc-project-backend:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy frontend image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pwc-project-frontend:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  push-to-acr:
    name: Push Docker Images to Azure Container Registry
    runs-on: ubuntu-latest
    needs: build-and-scan-images
    if: >
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Check Azure configuration
        id: azure_check
        shell: bash
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] || [ -z "${{ vars.ACR_NAME }}" ] || [ -z "${{ vars.ACR_LOGIN_SERVER }}" ]; then
            echo "azure_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "azure_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.azure_check.outputs.azure_ready == 'true'
        uses: actions/checkout@v4

      - name: Build backend image for registry
        if: steps.azure_check.outputs.azure_ready == 'true'
        run: docker build -t "${{ env.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ env.IMAGE_TAG }}" ./backend

      - name: Build frontend image for registry
        if: steps.azure_check.outputs.azure_ready == 'true'
        run: docker build -t "${{ env.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ env.IMAGE_TAG }}" ./frontend

      - name: Azure Login
        if: steps.azure_check.outputs.azure_ready == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Login to Azure Container Registry
        if: steps.azure_check.outputs.azure_ready == 'true'
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Push backend image
        if: steps.azure_check.outputs.azure_ready == 'true'
        run: docker push "${{ env.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ env.IMAGE_TAG }}"

      - name: Push frontend image
        if: steps.azure_check.outputs.azure_ready == 'true'
        run: docker push "${{ env.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ env.IMAGE_TAG }}"
