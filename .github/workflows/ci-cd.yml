
name: PWC Project CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_aks_only:
        description: "Create AKS cluster and node pools only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  FRONTEND_IMAGE: fronted.azurecr.io/pwc-project-frontend
  BACKEND_IMAGE: backends.azurecr.io/pwc-project-backend

jobs:
  # 1. Precheck existing CI/CD configuration
  precheck:
    name: Precheck
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create_aks_only) }}
    runs-on: ubuntu-24.04

    outputs:
      azure_ready: ${{ steps.check.outputs.azure_ready }}
      sonar_enabled: ${{ steps.check.outputs.sonar_enabled }}

    steps:
      - name: Check configuration
        id: check
        env:
          FRONTEND_CLIENT_ID: ${{ secrets.FRONTEND_AZURE_CLIENT_ID }}
          FRONTEND_TENANT_ID: ${{ secrets.FRONTEND_AZURE_TENANT_ID }}
          FRONTEND_SUBSCRIPTION_ID: ${{ secrets.FRONTEND_AZURE_SUBSCRIPTION_ID }}
          BACKEND_CLIENT_ID: ${{ secrets.BACKEND_AZURE_CLIENT_ID }}
          BACKEND_TENANT_ID: ${{ secrets.BACKEND_AZURE_TENANT_ID }}
          BACKEND_SUBSCRIPTION_ID: ${{ secrets.BACKEND_AZURE_SUBSCRIPTION_ID }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$FRONTEND_CLIENT_ID" &&
                -n "$FRONTEND_TENANT_ID" &&
                -n "$FRONTEND_SUBSCRIPTION_ID" &&
                -n "$BACKEND_CLIENT_ID" &&
                -n "$BACKEND_TENANT_ID" &&
                -n "$BACKEND_SUBSCRIPTION_ID" ]]; then
            echo "azure_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "azure_ready=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "sonar_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "sonar_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  # 2. Code quality and Bicep syntax
  code-quality:
    name: Code Quality
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create_aks_only) }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep
        run: |
          az bicep build --file infra/main.bicep
          az bicep build --file infra/modules/aks.bicep

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/pwc-project

  # 3. Sonar scan
  sonar:
    name: Sonar Scan
    needs: precheck
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create_aks_only) && needs.precheck.outputs.sonar_enabled == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Sonar scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="https://sonarcloud.io" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli

  # 4. Trivy filesystem scan
  trivy-fs:
    name: Trivy Filesystem Scan
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create_aks_only) }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # 5. Helm validation
  helm-lint:
    name: Helm Validation
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create_aks_only) }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/pwc-project

      - name: Render Helm templates
        run: helm template pwc-project helm/pwc-project

  # 6. Build and scan frontend/backend images
  build-and-scan-images:
    name: Build and Scan Images
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create_aks_only) }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: docker build -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" ./frontend

      - name: Build backend
        run: docker build -t "${BACKEND_IMAGE}:${GITHUB_SHA}" ./backend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: image
          image-ref: fronted.azurecr.io/pwc-project-frontend:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: image
          image-ref: backends.azurecr.io/pwc-project-backend:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

  # 7. Push images to the existing ACR registries
  push-to-acr:
    name: Push Images to ACR
    needs:
      - precheck
      - build-and-scan-images
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create_aks_only) && needs.precheck.outputs.azure_ready == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" ./frontend

      - name: Build backend image
        run: docker build -t "${BACKEND_IMAGE}:${GITHUB_SHA}" ./backend

      - name: Azure login for frontend registry
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Push frontend image
        run: |
          az acr login --name fronted
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"

      - name: Azure login for backend registry
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Push backend image
        run: |
          az acr login --name backends
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"

  # 8. AKS infrastructure deployment - manual AKS-only mode
  create-aks:
    name: Create AKS Cluster and Node Pools
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_aks_only }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login for AKS
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          az bicep build --file infra/main.bicep
          az bicep build --file infra/modules/aks.bicep

      - name: Verify Azure subscription and resource group
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          az account show --output table
          az group show \
            --name "$AKS_RESOURCE_GROUP" \
            --output table

      - name: Preview infrastructure changes
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          az deployment group what-if \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              clusterName="$AKS_NAME" \
              location="$AZURE_LOCATION"

      - name: Deploy AKS and node pools
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          az deployment group create \
            --name "aks-infrastructure-${GITHUB_RUN_ID}" \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              clusterName="$AKS_NAME" \
              location="$AZURE_LOCATION"

      - name: Verify AKS cluster
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
        run: |
          set -euo pipefail

          az aks show \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --query "{name:name, location:location, provisioningState:provisioningState}" \
            --output table

          az aks nodepool list \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --cluster-name "$AKS_NAME" \
            --output table
