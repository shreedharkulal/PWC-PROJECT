  # ==================================================
  # ACTIVE: CREATE AKS CLUSTER AND NODE POOLS
  # ==================================================
  create-aks:
    name: Create AKS Cluster and Node Pools
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Authenticate to Azure through GitHub OIDC
      - name: Azure Login for AKS
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      # 3. Validate Bicep templates
      - name: Validate Bicep
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep
          az bicep build --file infra/modules/aks.bicep

      # 4. Verify subscription and resource group
      - name: Verify Azure configuration
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          echo "Checking Azure subscription..."
          az account show --output table

          echo "Checking resource group..."
          az group show \
            --name "$AKS_RESOURCE_GROUP" \
            --output table

          echo "Target AKS cluster: $AKS_NAME"
          echo "Target region: $AZURE_LOCATION"

      # 5. Preview planned infrastructure changes
      - name: Preview AKS deployment
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          az deployment group what-if \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              clusterName="$AKS_NAME" \
              location="$AZURE_LOCATION"

      # 6. Create AKS and its node pools
      - name: Deploy AKS infrastructure
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          az deployment group create \
            --name "aks-infrastructure-${GITHUB_RUN_ID}" \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              clusterName="$AKS_NAME" \
              location="$AZURE_LOCATION"

      # 7. Verify cluster status and node pools
      - name: Verify AKS cluster
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
        run: |
          set -euo pipefail

          az aks show \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --query "{name:name, location:location, provisioningState:provisioningState}" \
            --output table

          az aks nodepool list \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --cluster-name "$AKS_NAME" \
            --output table
