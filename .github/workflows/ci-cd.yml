name: PWC Project CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  code-quality:
    name: Code Quality and Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm install

      - name: Run backend lint
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm run lint --if-present

      - name: Run backend unit tests
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm test --if-present

  build-and-scan-images:
    name: Build and Scan Docker Images
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pwc-project-backend:${{ env.IMAGE_TAG }} ./backend

      - name: Build frontend image
        run: docker build -t pwc-project-frontend:${{ env.IMAGE_TAG }} ./frontend

      - name: Scan backend image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pwc-project-backend:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan frontend image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pwc-project-frontend:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  push-to-acr:
    name: Push Docker Images to Azure Container Registry
    runs-on: ubuntu-latest
    needs: build-and-scan-images
    if: >
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      secrets.AZURE_CLIENT_ID != '' &&
      secrets.AZURE_TENANT_ID != '' &&
      secrets.AZURE_SUBSCRIPTION_ID != '' &&
      vars.ACR_NAME != '' &&
      vars.ACR_LOGIN_SERVER != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image for registry
        run: docker build -t "${{ vars.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ env.IMAGE_TAG }}" ./backend

      - name: Build frontend image for registry
        run: docker build -t "${{ vars.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ env.IMAGE_TAG }}" ./frontend

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Push backend image
        run: docker push "${{ vars.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ env.IMAGE_TAG }}"

      - name: Push frontend image
        run: docker push "${{ vars.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ env.IMAGE_TAG }}"
