name: PWC Project CI-CD

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "helm/pwc-project/values-dev.yaml"
      - "helm/pwc-project/values-prod.yaml"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      promote_production:
        description: "Promote this run's tested image to production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  HELM_VERSION: "v3.16.4"
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # 1. Install, lint, test and scan source code
  quality-and-security:
    name: Quality and source security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Run unit tests
        working-directory: backend
        run: npm test

      - name: Scan source and dependencies with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Validate Helm chart
        run: |
          helm lint helm/pwc-project
          helm lint helm/pwc-project \
            -f helm/pwc-project/values-dev.yaml
          helm lint helm/pwc-project \
            -f helm/pwc-project/values-prod.yaml

      - name: Render development manifests
        run: |
          helm template pwc-project \
            helm/pwc-project \
            --namespace pwc-dev \
            -f helm/pwc-project/values-dev.yaml \
            > /tmp/dev-manifests.yaml

      - name: Render production manifests
        run: |
          helm template pwc-project \
            helm/pwc-project \
            --namespace pwc-prod \
            -f helm/pwc-project/values-prod.yaml \
            > /tmp/prod-manifests.yaml

  # 2. Build images, scan them and publish to ACR
  build-scan-push:
    name: Build, scan and push images
    runs-on: ubuntu-latest
    needs: quality-and-security
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/pwc-project-backend:$IMAGE_TAG" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/pwc-project-frontend:$IMAGE_TAG" \
            ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
        env:
          # Image is local to the runner; scan it before pushing.
          TRIVY_IMAGE_SRC: docker

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Push backend image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/pwc-project-backend:$IMAGE_TAG"

      - name: Push frontend image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/pwc-project-frontend:$IMAGE_TAG"

      - name: Save image tag for downstream jobs
        run: echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

  # 3. Update GitOps values for development
  update-development:
    name: Update development Helm values
    runs-on: ubuntu-latest
    needs: build-scan-push
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install yq
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update development image tags
        run: |
          yq -i '.backend.image.tag = strenv(IMAGE_TAG)' \
            helm/pwc-project/values-dev.yaml
          yq -i '.frontend.image.tag = strenv(IMAGE_TAG)' \
            helm/pwc-project/values-dev.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}

      - name: Commit and push GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/pwc-project/values-dev.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(dev): deploy ${GITHUB_SHA}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # 4. Wait for Argo CD to deploy development, then smoke test
  smoke-test-development:
    name: Development smoke test
    runs-on: ubuntu-latest
    needs: update-development

    steps:
      - name: Wait for development rollout
        env:
          DEV_APP_URL: ${{ vars.DEV_APP_URL }}
        run: |
          test -n "$DEV_APP_URL"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "$DEV_APP_URL/api/health"; then
              echo "Development health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Development health check failed."
          exit 1

  # 5. Production promotion is opt-in and requires environment approval
  promote-production:
    name: Promote tested image to production
    runs-on: ubuntu-latest
    needs:
      - build-scan-push
      - update-development
      - smoke-test-development
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.promote_production == true &&
      github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install yq
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Promote the tested image tag
        run: |
          yq -i '.backend.image.tag = strenv(IMAGE_TAG)' \
            helm/pwc-project/values-prod.yaml
          yq -i '.frontend.image.tag = strenv(IMAGE_TAG)' \
            helm/pwc-project/values-prod.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}

      - name: Commit and push production GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/pwc-project/values-prod.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(prod): promote ${GITHUB_SHA}"
            git push origin HEAD:main
          fi

  # 6. Verify production after Argo CD syncs it
  verify-production:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs: promote-production
    if: needs.promote-production.result == 'success'

    steps:
      - name: Check production health
        env:
          PROD_APP_URL: ${{ vars.PROD_APP_URL }}
        run: |
          test -n "$PROD_APP_URL"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "$PROD_APP_URL/api/health"; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Production health check failed."
          exit 1
