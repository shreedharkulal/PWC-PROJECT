name: PWC Project CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: pwc-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Precheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Precheck completed successfully."

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: precheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Frontend lint
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No frontend lint script configured."
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Backend lint
        working-directory: backend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No backend lint script configured."
          fi

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: code-quality
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarCloud scan
        if: ${{ vars.SONAR_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Skip SonarCloud
        if: ${{ vars.SONAR_ENABLED != 'true' }}
        run: echo "SonarCloud is not enabled."

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: precheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  helm-lint:
    name: Helm Validation
    runs-on: ubuntu-latest
    needs: precheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./helm/pwc-project

      - name: Validate Dev values
        run: |
          helm template pwc-project-dev ./helm/pwc-project \
            -f ./helm/pwc-project/values-dev.yaml

      - name: Validate Production values
        run: |
          helm template pwc-project-prod ./helm/pwc-project \
            -f ./helm/pwc-project/values-prod.yaml

  build-and-scan-images:
    name: Build and Scan Images
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - trivy-fs
      - helm-lint
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: pwc-project-frontend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/frontend-image.tar

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          input: /tmp/frontend-image.tar
          scan-type: image
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: pwc-project-backend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          input: /tmp/backend-image.tar
          scan-type: image
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

  push-frontend-to-acr:
    name: Push Frontend to ACR
    runs-on: ubuntu-latest
    needs: build-and-scan-images
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Login to frontend ACR
        run: az acr login --name fronted

      - name: Build frontend image
        run: |
          docker build \
            -t fronted.azurecr.io/pwc-project-frontend:${GITHUB_SHA} \
            ./frontend

      - name: Push frontend image
        run: |
          docker push fronted.azurecr.io/pwc-project-frontend:${GITHUB_SHA}

  push-backend-to-acr:
    name: Push Backend to ACR
    runs-on: ubuntu-latest
    needs: build-and-scan-images
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Login to backend ACR
        run: az acr login --name backends

      - name: Build backend image
        run: |
          docker build \
            -t backends.azurecr.io/backends:${GITHUB_SHA} \
            ./backend

      - name: Push backend image
        run: |
          docker push backends.azurecr.io/backends:${GITHUB_SHA}

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs:
      - push-frontend-to-acr
      - push-backend-to-acr
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Dev image tags
        run: |
          sed -i "s|^\([[:space:]]*tag:[[:space:]]*\).*|\1\"${GITHUB_SHA}\"|" \
            ./helm/pwc-project/values-dev.yaml

      - name: Commit Dev image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./helm/pwc-project/values-dev.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Dev image tags [skip ci]"
            git push origin develop
          else
            echo "Dev image tags are already up to date."
          fi

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
      - push-frontend-to-acr
      - push-backend-to-acr
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Production image tags
        run: |
          sed -i "s|^\([[:space:]]*tag:[[:space:]]*\).*|\1\"${GITHUB_SHA}\"|" \
            ./helm/pwc-project/values-prod.yaml

      - name: Commit Production image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./helm/pwc-project/values-prod.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Production image tags [skip ci]"
            git push origin main
          else
            echo "Production image tags are already up to date."
          fi

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group demo \
            --name aks-pwc-project \
            --overwrite-existing

      - name: Apply Argo CD Production application
        run: |
          kubectl apply -f ./argocd/prod.yaml

      - name: Wait for Production Argo CD application
        run: |
          kubectl wait \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/pwc-project-prod \
            -n argocd \
            --timeout=300s

          kubectl wait \
            --for=jsonpath='{.status.health.status}'=Healthy \
            application/pwc-project-prod \
            -n argocd \
            --timeout=300s
