name: PWC Project CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
  AKS_NAME: ${{ vars.AKS_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

jobs:

  # --------------------------------------------------
  # Other CI/CD stages are disabled for now
  # --------------------------------------------------

  # precheck:
  #   ...

  # code-quality:
  #   ...

  # sonar:
  #   ...

  # trivy-fs:
  #   ...

  # helm-lint:
  #   ...

  # build-and-scan-images:
  #   ...

  # push-to-acr:
  #   ...

  # --------------------------------------------------
  # Stage 1: Validate Bicep templates
  # --------------------------------------------------

  validate-bicep:
    name: Validate Bicep Templates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate main Bicep template
        run: az bicep build --file infra/main.bicep

      - name: Validate AKS module
        run: az bicep build --file infra/modules/aks.bicep

  # --------------------------------------------------
  # Stage 2: Azure Login
  # --------------------------------------------------

  azure-login:
    name: Azure Login
    runs-on: ubuntu-24.04
    needs: validate-bicep

    steps:
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure account and resource group
        run: |
          set -euo pipefail

          az account show --output table

          az group show \
            --name "$AKS_RESOURCE_GROUP" \
            --output table

  # --------------------------------------------------
  # Stage 3: What-If Preview
  # Runs before any infrastructure deployment
  # --------------------------------------------------

  aks-what-if:
    name: AKS Deployment What-If
    runs-on: ubuntu-24.04
    needs: azure-login

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Preview AKS infrastructure changes
        run: |
          set -euo pipefail

          az deployment group what-if \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              clusterName="$AKS_NAME" \
              location="$AZURE_LOCATION"

  # --------------------------------------------------
  # Stage 4: Deploy AKS infrastructure
  # Runs only after What-If succeeds
  # --------------------------------------------------

  deploy-aks:
    name: Deploy AKS Cluster and Node Pools
    runs-on: ubuntu-24.04
    needs: aks-what-if

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy AKS infrastructure
        run: |
          set -euo pipefail

          az deployment group create \
            --name "aks-infrastructure-${GITHUB_RUN_ID}" \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              clusterName="$AKS_NAME" \
              location="$AZURE_LOCATION"

  # --------------------------------------------------
  # Stage 5: Verify AKS cluster and node pools
  # --------------------------------------------------

  verify-aks:
    name: Verify AKS Deployment
    runs-on: ubuntu-24.04
    needs: deploy-aks

    steps:
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Verify AKS cluster
        run: |
          set -euo pipefail

          az aks show \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --query "{name:name, location:location, state:provisioningState}" \
            --output table

      - name: Verify AKS node pools
        run: |
          set -euo pipefail

          az aks nodepool list \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --cluster-name "$AKS_NAME" \
            --output table
