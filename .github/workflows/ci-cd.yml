
name: PWC Project CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}

  FRONTEND_ACR_NAME: fronted
  FRONTEND_ACR_LOGIN_SERVER: fronted.azurecr.io
  FRONTEND_IMAGE: pwc-project-frontend

  BACKEND_ACR_NAME: backends
  BACKEND_ACR_LOGIN_SERVER: backends.azurecr.io
  BACKEND_IMAGE: backends

concurrency:
  group: pwc-project-main-cicd
  cancel-in-progress: false

jobs:
  code-quality:
    name: Code Quality and Backend Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm install

      - name: Run backend lint
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm run lint --if-present

      - name: Run backend unit tests
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm test --if-present

  sonar:
    name: SonarQube Analysis
    needs: code-quality
    continue-on-error: true

    if: >-
      ${{
        vars.SONAR_HOST_URL != '' &&
        vars.SONAR_PROJECT_KEY != '' &&
        vars.SONAR_ORGANIZATION != ''
      }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,frontend
            -Dsonar.qualitygate.wait=true
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

  trivy-fs:
    name: Trivy Source Scan
    needs: code-quality
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  helm-lint:
    name: Helm Lint and Template Validation
    needs: code-quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values.yaml

          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values-dev.yaml

          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values-prod.yaml

      - name: Render Helm templates
        run: |
          helm template pwc-project ./helm/pwc-project \
            -f ./helm/pwc-project/values.yaml \
            > /tmp/pwc-render.yaml

          helm template pwc-project ./helm/pwc-project \
            -f ./helm/pwc-project/values-dev.yaml \
            > /tmp/pwc-render-dev.yaml

          helm template pwc-project ./helm/pwc-project \
            -f ./helm/pwc-project/values-prod.yaml \
            > /tmp/pwc-render-prod.yaml

  build-and-scan-images:
    name: Build and Scan Docker Images
    needs: [code-quality, helm-lint]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            ./frontend

      - name: Trivy backend image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: backends:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy frontend image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pwc-project-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  push-frontend-to-acr:
    name: Push Frontend Image to Frontend ACR
    needs: [build-and-scan-images, sonar, trivy-fs]

    if: >-
      ${{
        !cancelled() &&
        needs.build-and-scan-images.result == 'success' &&
        (needs.sonar.result == 'success' || needs.sonar.result == 'skipped' || needs.sonar.result == 'failure') &&
        needs.trivy-fs.result == 'success' &&
        github.ref == 'refs/heads/main'
      }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login - Frontend
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Login to Frontend ACR
        run: az acr login --name "${FRONTEND_ACR_NAME}"

      - name: Build frontend image for registry
        run: |
          docker build \
            -t "${FRONTEND_ACR_LOGIN_SERVER}/${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            "${FRONTEND_ACR_LOGIN_SERVER}/${FRONTEND_IMAGE}:${IMAGE_TAG}"

  push-backend-to-acr:
    name: Push Backend Image to Backend ACR
    needs: [build-and-scan-images, sonar, trivy-fs]

    if: >-
      ${{
        !cancelled() &&
        needs.build-and-scan-images.result == 'success' &&
        (needs.sonar.result == 'success' || needs.sonar.result == 'skipped' || needs.sonar.result == 'failure') &&
        needs.trivy-fs.result == 'success' &&
        github.ref == 'refs/heads/main'
      }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login - Backend
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Login to Backend ACR
        run: az acr login --name "${BACKEND_ACR_NAME}"

      - name: Build backend image for registry
        run: |
          docker build \
            -t "${BACKEND_ACR_LOGIN_SERVER}/${BACKEND_IMAGE}:${IMAGE_TAG}" \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            "${BACKEND_ACR_LOGIN_SERVER}/${BACKEND_IMAGE}:${IMAGE_TAG}"

  deploy-dev:
    name: Update Dev GitOps Values and trigger Argo CD
    needs: [push-frontend-to-acr, push-backend-to-acr]

    if: ${{ github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Dev values
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          yq -i '
            .frontend.image.repository = (strenv(FRONTEND_ACR_LOGIN_SERVER) + "/" + strenv(FRONTEND_IMAGE)) |
            .frontend.image.tag = strenv(IMAGE_TAG) |
            .backend.image.repository = (strenv(BACKEND_ACR_LOGIN_SERVER) + "/" + strenv(BACKEND_IMAGE)) |
            .backend.image.tag = strenv(IMAGE_TAG)
          ' helm/pwc-project/values-dev.yaml

      - name: Commit and push dev values
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/pwc-project/values-dev.yaml

          if git diff --cached --quiet; then
            echo "Dev image tags are already up to date"
            exit 0
          fi

          git commit -m "chore(dev): deploy images ${IMAGE_TAG}"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy-prod:
    name: Production Deployment (Approval Required)
    needs: [deploy-dev]

    if: ${{ github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Production values
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          yq -i '
            .frontend.image.repository = (strenv(FRONTEND_ACR_LOGIN_SERVER) + "/" + strenv(FRONTEND_IMAGE)) |
            .frontend.image.tag = strenv(IMAGE_TAG) |
            .backend.image.repository = (strenv(BACKEND_ACR_LOGIN_SERVER) + "/" + strenv(BACKEND_IMAGE)) |
            .backend.image.tag = strenv(IMAGE_TAG)
          ' helm/pwc-project/values-prod.yaml

      - name: Commit and push production values
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/pwc-project/values-prod.yaml

          if git diff --cached --quiet; then
            echo "Production image tags are already up to date"
          else
            git commit -m "chore(prod): release images ${IMAGE_TAG}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Azure Login for AKS
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: demo
          cluster-name: aks-pwc-project

      - name: Create or update production Argo CD Application
        run: |
          kubectl apply -f argocd/prod.yaml

      - name: Wait for Argo CD sync
        run: |
          kubectl wait \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/pwc-project-prod \
            -n argocd \
            --timeout=600s

      - name: Wait for Argo CD application health
        run: |
          kubectl wait \
            --for=jsonpath='{.status.health.status}'=Healthy \
            application/pwc-project-prod \
            -n argocd \
            --timeout=600s
