name: PWC Project CI/CD

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  precheck:
    name: Precheck required config
    runs-on: ubuntu-latest
    outputs:
      sonar_enabled: ${{ steps.check.outputs.sonar_enabled }}
      azure_ready: ${{ steps.check.outputs.azure_ready }}

    steps:
      - name: Check config
        id: check
        shell: bash
        run: |
          if [[ -n "${{ secrets.SONAR_TOKEN }}" && -n "${{ vars.SONAR_HOST_URL }}" && -n "${{ vars.SONAR_PROJECT_KEY }}" ]]; then
            echo "sonar_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "sonar_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "${{ secrets.AZURE_CLIENT_ID }}" && -n "${{ secrets.AZURE_TENANT_ID }}" && -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" && -n "${{ vars.ACR_NAME }}" && -n "${{ vars.ACR_LOGIN_SERVER }}" ]]; then
            echo "azure_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "azure_ready=false" >> "$GITHUB_OUTPUT"
          fi

  code-quality:
    name: Code Quality and Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm install

      - name: Run backend lint
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm run lint --if-present

      - name: Run backend unit tests
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm test --if-present

  sonar:
    name: SonarQube Analysis
    needs: [precheck, code-quality]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,frontend
            -Dsonar.qualitygate.wait=true
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
