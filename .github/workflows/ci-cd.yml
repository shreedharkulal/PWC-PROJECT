name: PWC Project CI-CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "helm/pwc-project/values-dev.yaml"
      - "helm/pwc-project/values-prod.yaml"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  # Stage 1: Checkout, install, lint and test
  code-quality:
    name: Checkout and code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: ESLint
        working-directory: backend
        run: npm run lint

      - name: Unit Tests
        working-directory: backend
        run: npm test

  # Stage 2: SonarQube analysis and quality gate
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,frontend
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # Stage 3: Scan source and dependencies
  source-security:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Stage 4: Build, scan and push images
  build-scan-push:
    name: Build, Scan and Push to ACR
    runs-on: ubuntu-latest
    needs: source-security
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/pwc-project-backend:$GITHUB_SHA" \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/pwc-project-frontend:$GITHUB_SHA" \
            ./frontend

      - name: Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Push Backend Image to ACR
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/pwc-project-backend:$GITHUB_SHA"

      - name: Push Frontend Image to ACR
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/pwc-project-frontend:$GITHUB_SHA"

  # Continue with your existing GitOps jobs:
  # update-development -> smoke-test-development
  # -> production approval -> promote-production
  # -> verify-production
