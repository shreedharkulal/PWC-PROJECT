name: PWC Project CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/**
    paths-ignore:
      - "helm/**"
      - "README.md"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      promote_production:
        description: "Promote the current workflow commit to production"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  security-events: write
  id-token: write

env:
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # 1. Install dependencies, lint and test
  code-quality:
    name: Code Quality and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Run Backend Lint
        working-directory: backend
        run: npm run lint --if-present

      - name: Run Backend Tests
        working-directory: backend
        run: npm test --if-present


  # 2. SonarQube code analysis
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,frontend
            -Dsonar.qualitygate.wait=true


  # 3. Scan source code and dependencies
  source-security:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Source and Dependency Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  # 4. Validate Helm charts
  helm-validation:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint ./helm/pwc-project
          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values-dev.yaml
          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values-prod.yaml

      - name: Render Development Templates
        run: |
          helm template pwc-project ./helm/pwc-project \
            -f ./helm/pwc-project/values-dev.yaml

      - name: Render Production Templates
        run: |
          helm template pwc-project ./helm/pwc-project \
            -f ./helm/pwc-project/values-prod.yaml


  # 5. Build images, scan images, and push to Azure ACR
  build-scan-push:
    name: Build, Scan and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - sonarqube
      - source-security
      - helm-validation
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t "${{ vars.ACR_LOGIN_SERVER }}/pwc-project-backend:${IMAGE_TAG}" \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t "${{ vars.ACR_LOGIN_SERVER }}/pwc-project-frontend:${IMAGE_TAG}" \
            ./frontend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Push Backend Image
        run: |
          docker push \
            "${{ vars.ACR_LOGIN_SERVER }}/pwc-project-backend:${IMAGE_TAG}"

      - name: Push Frontend Image
        run: |
          docker push \
            "${{ vars.ACR_LOGIN_SERVER }}/pwc-project-frontend:${IMAGE_TAG}"


  # 6. Update development Helm image tags
  update-development:
    name: Update Development Image Tags
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update Development Values
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.backend.image.tag = strenv(TAG)' \
            ./helm/pwc-project/values-dev.yaml
          yq -i '.frontend.image.tag = strenv(TAG)' \
            ./helm/pwc-project/values-dev.yaml

      - name: Commit and Push Development Values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/pwc-project/values-dev.yaml

          if ! git diff --cached --quiet; then
            git commit -m "ci: update development image to ${IMAGE_TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Development image tags are already up to date."
          fi


  # 7. Verify development endpoint
  smoke-test-development:
    name: Development Smoke Test
    runs-on: ubuntu-latest
    needs: update-development
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Check Development API
        env:
          DEV_APP_URL: ${{ vars.DEV_APP_URL }}
        run: |
          test -n "$DEV_APP_URL" || {
            echo "DEV_APP_URL repository variable is required"
            exit 1
          }

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "${DEV_APP_URL%/}/api/health"; then
              echo "Development API is healthy"
              exit 0
            fi

            echo "Attempt ${attempt}: API not ready; waiting 10 seconds"
            sleep 10
          done

          echo "Development smoke test failed"
          exit 1


  # 8. Manually approve and promote to production
  promote-production:
    name: Promote Image to Production
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote_production == true

    environment: production

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update Production Values
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.backend.image.tag = strenv(TAG)' \
            ./helm/pwc-project/values-prod.yaml
          yq -i '.frontend.image.tag = strenv(TAG)' \
            ./helm/pwc-project/values-prod.yaml

      - name: Commit and Push Production Values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/pwc-project/values-prod.yaml

          if ! git diff --cached --quiet; then
            git commit -m "release: promote ${IMAGE_TAG} to production"
            git push origin HEAD:main
          else
            echo "Production image tags are already up to date."
          fi


  # 9. Verify production endpoint after Argo CD syncs
  verify-production:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: promote-production
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote_production == true

    steps:
      - name: Check Production API
        env:
          PROD_APP_URL: ${{ vars.PROD_APP_URL }}
        run: |
          test -n "$PROD_APP_URL" || {
            echo "PROD_APP_URL repository variable is required"
            exit 1
          }

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "${PROD_APP_URL%/}/api/health"; then
              echo "Production API is healthy"
              exit 0
            fi

            echo "Attempt ${attempt}: API not ready; waiting 10 seconds"
            sleep 10
          done

          echo "Production smoke test failed"
          exit 1
```
