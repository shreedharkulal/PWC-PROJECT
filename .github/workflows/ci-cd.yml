name: PWC Project CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  code-quality:
    name: Code Quality and Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm install

      - name: Run backend lint
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm run lint --if-present

      - name: Run backend unit tests
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: npm test --if-present

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: code-quality
    if: >
      secrets.SONAR_TOKEN != '' &&
      vars.SONAR_HOST_URL != '' &&
      vars.SONAR_PROJECT_KEY != ''
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,frontend
            -Dsonar.qualitygate.wait=true

  trivy-fs:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    needs: code-quality
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: code-quality
    if: >
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      secrets.AZURE_CLIENT_ID != '' &&
      secrets.AZURE_TENANT_ID != '' &&
      secrets.AZURE_SUBSCRIPTION_ID != '' &&
      vars.ACR_NAME != '' &&
      vars.ACR_LOGIN_SERVER != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t "$ACR_LOGIN_SERVER/pwc-project-backend:$GITHUB_SHA" ./backend

      - name: Build Frontend Image
        run: |
          docker build -t "$ACR_LOGIN_SERVER/pwc-project-frontend:$GITHUB_SHA" ./frontend

      - name: Trivy Backend Image Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy Frontend Image Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Push Backend Image
        run: |
          docker push "$ACR_LOGIN_SERVER/pwc-project-backend:$GITHUB_SHA"

      - name: Push Frontend Image
        run: |
          docker push "$ACR_LOGIN_SERVER/pwc-project-frontend:$GITHUB_SHA"
