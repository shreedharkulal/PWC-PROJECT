name: PWC Project CI/CD

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      promote_production:
        description: "Promote the current main commit to production"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  security-events: write

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:

  # 1. Install dependencies, lint and test
  code-quality:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Lint
        working-directory: backend
        run: npm run lint --if-present

      - name: Unit Tests
        working-directory: backend
        run: npm test --if-present


  # 2. SonarQube quality analysis
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend,frontend
            -Dsonar.qualitygate.wait=true


  # 3. Source security scan
  trivy-filesystem:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  # 4. Validate Helm charts
  helm-validation:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate Development Chart
        run: |
          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values-dev.yaml

          helm template pwc-project ./helm/pwc-project \
            --namespace pwc-dev \
            -f ./helm/pwc-project/values-dev.yaml

      - name: Validate Production Chart
        run: |
          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values-prod.yaml

          helm template pwc-project ./helm/pwc-project \
            --namespace pwc-prod \
            -f ./helm/pwc-project/values-prod.yaml


  # 5. Build, scan and push images to ACR
  build-scan-push:
    name: Build, Scan and Push Images
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - sonarqube
      - trivy-filesystem
      - helm-validation

    if: >
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/pwc-project-backend:$GITHUB_SHA" \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/pwc-project-frontend:$GITHUB_SHA" \
            ./frontend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/pwc-project-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/pwc-project-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Push Backend Image
        run: |
          docker push "$ACR_LOGIN_SERVER/pwc-project-backend:$GITHUB_SHA"

      - name: Push Frontend Image
        run: |
          docker push "$ACR_LOGIN_SERVER/pwc-project-frontend:$GITHUB_SHA"


  # 6. Update dev Helm values automatically
  update-development:
    name: Update Development GitOps
    runs-on: ubuntu-latest
    needs: build-scan-push

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout Develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update Development Image Tags
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.backend.image.tag = strenv(TAG)' \
            helm/pwc-project/values-dev.yaml

          yq -i '.frontend.image.tag = strenv(TAG)' \
            helm/pwc-project/values-dev.yaml

      - name: Commit and Push GitOps Change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/pwc-project/values-dev.yaml

          if ! git diff --cached --quiet; then
            git commit -m "gitops: deploy ${GITHUB_SHA} to dev"
            git push origin HEAD:develop
          else
            echo "Development image tags are already current."
          fi


  # 7. Wait for dev deployment and test API
  development-smoke-test:
    name: Development Smoke Test
    runs-on: ubuntu-latest
    needs: update-development

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    steps:
      - name: Check Development API
        env:
          DEV_APP_URL: ${{ vars.DEV_APP_URL }}
        run: |
          test -n "$DEV_APP_URL" || {
            echo "Set the DEV_APP_URL repository variable."
            exit 1
          }

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error \
              "${DEV_APP_URL%/}/api/health"; then
              echo "Development API is healthy."
              exit 0
            fi

            echo "Waiting for Argo CD deployment: attempt $attempt"
            sleep 10
          done

          echo "Development deployment did not become healthy."
          exit 1


  # 8. Production GitOps update.
  # GitHub pauses this job until the protected environment is approved.
  promote-production:
    name: Production Approval and GitOps Update
    runs-on: ubuntu-latest
    needs: build-scan-push

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote_production == true

    environment: production

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update Production Image Tags
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.backend.image.tag = strenv(TAG)' \
            helm/pwc-project/values-prod.yaml

          yq -i '.frontend.image.tag = strenv(TAG)' \
            helm/pwc-project/values-prod.yaml

      - name: Commit and Push Production GitOps Change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/pwc-project/values-prod.yaml

          if ! git diff --cached --quiet; then
            git commit -m "gitops: promote ${GITHUB_SHA} to prod"
            git push origin HEAD:main
          else
            echo "Production image tags are already current."
          fi


  # 9. Verify prod after Argo CD sync
  production-smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: promote-production

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote_production == true

    steps:
      - name: Check Production API
        env:
          PROD_APP_URL: ${{ vars.PROD_APP_URL }}
        run: |
          test -n "$PROD_APP_URL" || {
            echo "Set the PROD_APP_URL repository variable."
            exit 1
          }

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error \
              "${PROD_APP_URL%/}/api/health"; then
              echo "Production API is healthy."
              exit 0
            fi

            echo "Waiting for Argo CD deployment: attempt $attempt"
            sleep 10
          done

          echo "Production deployment did not become healthy."
          exit 1
```
