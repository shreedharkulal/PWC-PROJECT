name: PWC Multi-Microservice CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "helm/pwc-project/**"
      - "argocd/**"
      - ".github/workflows/multi-microservice-cicd.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pwc-microservices-cicd
  cancel-in-progress: false

jobs:
  helm-validation:
    name: Helm Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install YAML validation dependency
        run: python3 -m pip install PyYAML

      - name: Validate Dev
        run: |
          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values-dev.yaml

          helm template pwc-project-dev ./helm/pwc-project \
            -f ./helm/pwc-project/values-dev.yaml \
            --namespace default \
            > /tmp/render-dev.yaml

      - name: Validate Prod
        run: |
          helm lint ./helm/pwc-project \
            -f ./helm/pwc-project/values-prod.yaml

          helm template pwc-project-prod ./helm/pwc-project \
            -f ./helm/pwc-project/values-prod.yaml \
            --namespace default \
            > /tmp/render-prod.yaml

      - name: Validate Sync-Wave Annotations
        run: |
          python3 - <<'PY'
          import yaml

          files = [
              "/tmp/render-dev.yaml",
              "/tmp/render-prod.yaml",
          ]

          annotation = "argocd.argoproj.io/sync-wave"

          # Sync waves are not required for frontend or backend Services.
          excluded_services = {
              "pwc-project-backend",
              "pwc-project-frontend",
          }

          for file in files:
              with open(file, encoding="utf-8") as stream:
                  documents = yaml.safe_load_all(stream)

                  for resource in documents:
                      if not resource:
                          continue

                      kind = resource.get("kind")
                      if kind not in ("Deployment", "Service"):
                          continue

                      metadata = resource.get("metadata", {})
                      name = metadata.get("name", "")
                      annotations = metadata.get("annotations") or {}

                      # Ignore frontend and backend Services.
                      if kind == "Service" and name in excluded_services:
                          continue

                      if annotation not in annotations:
                          raise SystemExit(
                              f"ERROR: Missing {annotation} on "
                              f"{kind}/{name} in {file}"
                          )

                      print(
                          f"OK: {kind}/{name} "
                          f"sync-wave={annotations[annotation]}"
                      )

          print("Sync-wave annotation validation passed.")
          PY

  deploy-dev:
    name: Deploy Dev Through Argo CD
    needs: helm-validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group demo \
            --name aks-pwc-project \
            --overwrite-existing

      - name: Apply Dev Argo CD Application
        run: kubectl apply -f argocd/dev.yaml

      - name: Wait for Dev to become Synced
        run: |
          kubectl wait \
            --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/pwc-project-dev \
            --timeout=600s

      - name: Wait for Dev to become Healthy
        run: |
          kubectl wait \
            --namespace argocd \
            --for=jsonpath='{.status.health.status}'=Healthy \
            application/pwc-project-dev \
            --timeout=600s

      - name: Show Dev status
        run: |
          kubectl get application pwc-project-dev \
            --namespace argocd

  deploy-prod:
    name: Deploy Prod Through Argo CD
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AKS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AKS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AKS_AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group demo \
            --name aks-pwc-project \
            --overwrite-existing

      - name: Apply Prod Argo CD Application
        run: kubectl apply -f argocd/prod.yaml

      - name: Wait for Prod to become Synced
        run: |
          kubectl wait \
            --namespace argocd \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/pwc-project-dev \
            --timeout=600s

      - name: Wait for Prod to become Healthy
        run: |
          kubectl wait \
            --namespace argocd \
            --for=jsonpath='{.status.health.status}'=Healthy \
            application/pwc-project-dev \
            --timeout=600s

      - name: Show Prod status
        run: |
          kubectl get application pwc-project-prod \
            --namespace argocd
